baseURL = "https://bugs.cc/"
theme = "hugo-bearcub"
title = "Kevin Cui's Blog"
copyright = "Kevin Cui (CC BY 4.0)"
locale = "en-US"
defaultContentLanguage = "en"

enableRobotsTXT = true

pygmentscodefences = true
pygmentscodefencesguesssyntax = false

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    lineNos = false
    lineNumbersInTable = false
    noClasses = false

[languages]
  [languages.en]
    label = "en-US 🇺🇸"
    locale = "en-US"
    contentDir = "content"
    weight = 1
    [languages.en.params]
      RSS = "/index.xml"
      FollowFeedID = "67444163872609280"

  [languages.zh]
    label = "zh-CN 🇨🇳"
    locale = "zh-CN"
    contentDir = "content.zh"
    weight = 2
    [languages.zh.params]
      RSS = "/zh/index.xml"
      FollowFeedID = "67444337223193600"

[params]
  description = "Kevin Cui's Blog"
  dateFormat = "2006-01-02"
  madeWith = "Made with [Bear Cub](https://github.com/clente/hugo-bearcub)"
  themeStyle = "/css/custom"

  FollowUserId = "67028119038586880"

  [params.social]
    twitter = "Free_BlackHole"

  [params.author]
    name = "Kevin Cui"
    email = "bh@bugs.cc"

[menu]

  [[menu.main]]
    identifier = "docs"
    name = "Docs"
    url = "https://docs.bugs.cc"
    params = {blank = true}
    weight = 3
